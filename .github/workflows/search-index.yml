name: Search index

# Keeps the Vectorize article vectors in line with the articles, and checks that the committed
# src/data/related-posts.json matches them. Pull requests write the Preview index; main writes the
# production index through the search-production Environment, which only main can use and which
# needs no approval. Setup steps:
# .agents/notes/implemented/feature/2026-10-17-hybrid-search.md#setting-up-the-index-jobs.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'wrangler.jsonc'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/embed-posts.mjs'
      - 'scripts/search-inputs.mjs'
      - 'scripts/search-index.mjs'
      - 'scripts/search-eval.mjs'
      - 'scripts/search-eval-scope.mjs'
      - 'scripts/cloudflare-api.mjs'
      - 'tests/fixtures/search-queries.json'
      - '.github/workflows/search-index.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  index:
    # The repository variable SEARCH_INDEX_ENABLED turns the jobs on once the Environments and
    # their secrets exist. Without it they are skipped, so CI stays green and no Environment is
    # created by accident. Pull requests from forks never run: they get no secrets, and Workers
    # Previews build only branches of this repository.
    if: >-
      vars.SEARCH_INDEX_ENABLED == 'true' && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'search-production' || 'search-preview' }}
    # One writer per index at a time; a queued run waits instead of cancelling a half-done write.
    concurrency:
      group: search-index-${{ github.event_name == 'push' && 'production' || 'preview' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMBED_TOKEN: ${{ secrets.CLOUDFLARE_EMBED_TOKEN }}
      SEARCH_INDEX: ${{ github.event_name == 'push' && 'blog-search' || 'blog-search-preview' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A rerun must not restore a historical article set to the production index.
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}
          # The evaluation scope below diffs against the previous main or the pull request base.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A separate step, so an overtaken build skips the sync and the evaluation below; the run
      # for the newer main writes and evaluates the index.
      - if: github.event_name == 'push'
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]; then
            echo 'main advanced during the build; refusing an obsolete production sync.' >&2
            exit 1
          fi
      - id: scope
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: node scripts/search-eval-scope.mjs "$BASE" | tee -a "$GITHUB_OUTPUT"
      # Mutation acceptance is not query visibility; the evaluation below checks real queries.
      # The sync runs on every push, so the index always follows the build.
      - id: sync
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/embed-posts.mjs --index "$SEARCH_INDEX" --prune --out related-posts.json
          else
            node scripts/embed-posts.mjs --index "$SEARCH_INDEX" --out related-posts.json
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: related-posts
          path: related-posts.json
          if-no-files-found: ignore
          retention-days: 7
      # Retries a failed evaluation for up to five minutes: queries see a fresh write late. It runs
      # when a search path changed or the sync wrote, and after a failed sync, such as a stale
      # related-posts.json, but not after a skipped one.
      - if: >-
          steps.sync.outcome == 'failure' ||
          (success() && (steps.scope.outputs.eval == 'true' || steps.sync.outputs.wrote == 'true'))
        run: node scripts/search-eval.mjs --index "$SEARCH_INDEX" --json search-eval.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-eval
          path: search-eval.json
          if-no-files-found: ignore
          retention-days: 30
