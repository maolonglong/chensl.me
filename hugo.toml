baseURL = 'https://chensl.me/'
title = '~chensl'
locale = 'zh-CN'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true

# https://github.com/gohugoio/hugo/issues/12152
capitalizeListTitles = false

# Disable all taxonomies (omit the table entirely and Hugo falls back to tags+categories).
[taxonomies]

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.extras.mark]
      enable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']

[services]
  [services.rss]
    limit = 20

[params]
  description = '陈劭珑的个人网站与技术博客'
  dateFormat = '2006-01-02'
  [params.author]
    email = 'shaolong.chen@outlook.it'
    name = 'Shaolong Chen'

[[menus.main]]
  name = '首页'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = '博客'
  pageRef = '/blog'
  weight = 20
