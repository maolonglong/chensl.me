{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      <p class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">{{ .Date.Format site.Params.dateFormat }}</time>
      </p>
    </header>

    {{ partial "floating-toc.html" . }}

    <div class="prose">
      {{ .Content }}
    </div>
  </article>

  {{- if and (eq .Section "blog") (ne .Params.comments false) }}
  {{ partial "comments.html" . }}
  {{- end }}
{{ end }}
